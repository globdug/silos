name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build (frontend + Tauri release binary)
        run: npm run tauri build

      # The in-app updater downloads this next to silos.exe and refuses to
      # install an exe whose SHA-256 doesn't match.
      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash src-tauri/target/release/silos.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  silos.exe" | Out-File -FilePath src-tauri/target/release/silos.exe.sha256 -Encoding ascii -NoNewline

      # Release notes = this version's section of CHANGELOG.md, so the GitHub
      # release and the changelog say the same thing.
      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          if ($text -match $pattern -and $Matches[1].Trim()) {
            $notes = $Matches[1].Trim()
          } else {
            $notes = "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/silos.exe
            src-tauri/target/release/silos.exe.sha256
          body_path: release-notes.md
          generate_release_notes: false
