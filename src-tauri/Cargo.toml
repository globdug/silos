[package]
name = "silos"
version = "0.3.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "silos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
mslnk = "0.1.8"
tauri-plugin-single-instance = "2.4.3"
ico = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
regex = "1.13.1"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
tauri-plugin-clipboard-manager = "2.3.2"
resvg = "0.47.0"
usvg = "0.47.0"
tiny-skia = "0.12.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_EnhancedStorage",
    "UI_Notifications",
    "Data_Xml_Dom",
    "Foundation",
] }

# Shortcuts (.app bundle + .icns) and session isolation (data_store_identifier)
# need no extra crates — both use std/existing deps (image, uuid). Notifications
# do:
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

